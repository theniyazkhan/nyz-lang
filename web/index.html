<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sylheti-Lang Interactive Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --panel-bg: #1f2937;
      --accent: #06b6d4;
      --accent-hover: #0891b2;
      --success: #10b981;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --border: #374151;
      --console-bg: #030712;
      --kw-color: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .brand-badge {
      background: linear-gradient(135deg, var(--accent), #3b82f6);
      color: #ffffff;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
    }

    h1 { font-size: 1.25rem; font-weight: 700; color: var(--text); }

    .header-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    select, button, .btn-learn {
      font-family: inherit;
      font-size: 0.85rem;
      border-radius: 8px;
      padding: 0.45rem 0.85rem;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      text-decoration: none;
    }

    select {
      background: var(--panel-bg);
      color: var(--text);
      border: 1px solid var(--border);
      outline: none;
    }

    .btn-learn {
      background: var(--panel-bg);
      color: #a5b4fc;
      border: 1px solid var(--border);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .btn-learn:hover {
      background: #312e81;
      color: white;
      border-color: #6366f1;
    }

    .btn-run {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }

    .btn-run:hover {
      background: linear-gradient(135deg, #059669, #047857);
      transform: translateY(-1px);
    }

    .btn-clear {
      background: var(--panel-bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-clear:hover { color: var(--text); background: var(--border); }

    .suggestions-bar {
      background: #0d1322;
      border-bottom: 1px solid var(--border);
      padding: 0.5rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
    }

    .suggestions-bar::-webkit-scrollbar { height: 4px; }
    .suggestions-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .sug-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .kw-chip {
      background: var(--panel-bg);
      color: var(--kw-color);
      font-family: 'Fira Code', monospace;
      font-size: 0.8rem;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }

    .kw-chip:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      padding: 1rem 1.25rem;
      min-height: 0;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-header {
      background: var(--panel-bg);
      padding: 0.6rem 1rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .editor-wrapper {
      flex: 1;
      position: relative;
      min-height: 280px;
    }

    textarea#codeEditor {
      width: 100%;
      height: 100%;
      background: transparent;
      color: #f3f4f6;
      font-family: 'Fira Code', monospace;
      font-size: 0.95rem;
      line-height: 1.6;
      padding: 1rem;
      border: none;
      outline: none;
      resize: none;
      tab-size: 2;
    }

    #consoleOutput {
      flex: 1;
      background: var(--console-bg);
      color: #10b981;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      padding: 1rem;
      overflow-y: auto;
      white-space: pre-wrap;
      min-height: 280px;
    }

    .console-input-row {
      display: none;
      background: var(--panel-bg);
      border-top: 1px solid var(--border);
      padding: 0.5rem 1rem;
      align-items: center;
      gap: 0.5rem;
    }

    .console-input-row.active {
      display: flex;
    }

    .console-input-row input {
      flex: 1;
      background: var(--console-bg);
      border: 1px solid var(--border);
      color: white;
      font-family: 'Fira Code', monospace;
      padding: 0.45rem 0.75rem;
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
    }

    /* Mobile Responsive Breakpoint */
    @media (max-width: 768px) {
      header { padding: 0.75rem 1rem; }
      h1 { font-size: 1.1rem; }
      main {
        grid-template-columns: 1fr;
        padding: 0.75rem 1rem;
        height: auto;
      }
      .editor-wrapper, #consoleOutput { min-height: 220px; }
      .header-controls { width: 100%; justify-content: space-between; }
      select { flex: 1; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>Sylheti Compiler</h1>
      <span class="brand-badge">.syl</span>
    </div>
    <div class="header-controls">
      <select id="presetSelect" onchange="loadPreset()">
        <option value="simple">Simple Input Demo</option>
        <option value="calculator">Calculator</option>
        <option value="factorial">Factorial</option>
        <option value="power">Power ^</option>
        <option value="logical">Logical Operators</option>
      </select>
      <a href="https://github.com/theniyazkhan/syleti_lang/blob/main/Language_Manual.txt" target="_blank" class="btn-learn">
        📖 Learn
      </a>
      <button class="btn-clear" onclick="clearConsole()">Clear</button>
      <button class="btn-run" onclick="runSylhetiCode()">▶ Run</button>
    </div>
  </header>

  <div class="suggestions-bar">
    <span class="sug-label">Tap to insert:</span>
    <span class="kw-chip" onclick="insertKeyword('dekha ')">dekha</span>
    <span class="kw-chip" onclick="insertKeyword('dhoro ')">dhoro</span>
    <span class="kw-chip" onclick="insertKeyword('ne ')">ne</span>
    <span class="kw-chip" onclick="insertKeyword('jodi ')">jodi</span>
    <span class="kw-chip" onclick="insertKeyword('naile ')">naile</span>
    <span class="kw-chip" onclick="insertKeyword('ghuro ')">ghuro</span>
    <span class="kw-chip" onclick="insertKeyword('ghur ')">ghur</span>
    <span class="kw-chip" onclick="insertKeyword('hasa')">hasa</span>
    <span class="kw-chip" onclick="insertKeyword('misa')">misa</span>
    <span class="kw-chip" onclick="insertKeyword('ar ')">ar</span>
    <span class="kw-chip" onclick="insertKeyword('ernay ')">ernay</span>
    <span class="kw-chip" onclick="insertKeyword('nabe ')">nabe</span>
    <span class="kw-chip" onclick="insertKeyword(' ^ ')">^</span>
  </div>

  <main>
    <div class="card">
      <div class="card-header">
        <span>SYLHETI EDITOR</span>
        <span>script.syl</span>
      </div>
      <div class="editor-wrapper">
        <textarea id="codeEditor" spellcheck="false"></textarea>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span>CONSOLE OUTPUT</span>
        <span id="statusBadge" style="color: #10b981;">Ready</span>
      </div>
      <div id="consoleOutput">=== Sylheti-Lang Interactive Playground ===\nClick "Run" or tap ▶ Run to execute script.</div>
      <div class="console-input-row" id="inputRow">
        <span style="color: #10b981; font-family: monospace;">Input ›</span>
        <input type="number" id="userInput" placeholder="Enter integer and press Enter..." onkeydown="handleInputSubmit(event)">
      </div>
    </div>
  </main>

  <script>
    const presets = {
      simple: `dekha "Ekta shongkha dein (Enter a number):";\ndhoro x;\nne x;\n\ndekha "Afne disoin (You entered):";\ndekha x;`,
      calculator: `dekha "=== Sylheti Calculator ===";\n\ndekha "Enter first number (a):";\ndhoro a;\nne a;\n\ndekha "Enter second number (b):";\ndhoro b;\nne b;\n\ndhoro sum = a + b;\ndekha "a + b =";\ndekha sum;\n\ndhoro pwr = a ^ b;\ndekha "a ^ b =";\ndekha pwr;`,
      factorial: `dekha "=== Factorial Calculator ===";\n\ndekha "Ekta shongkha (n) dein:";\ndhoro n;\nne n;\n\ndhoro fact = 1;\nghur (dhoro i = 1; i <= n; i = i + 1) {\n  fact = fact * i;\n}\n\ndekha "Factorial is:";\ndekha fact;`,
      power: `dekha "=== Exponentiation Power ^ Test ===";\n\ndhoro base = 2;\ndhoro exp = 3;\ndhoro res = base ^ exp;\ndekha "2 ^ 3 =";\ndekha res;\n\ndhoro assoc = 2 ^ 3 ^ 2;\ndekha "2 ^ 3 ^ 2 =";\ndekha assoc;`,
      logical: `dekha "=== Logical Operators Test ===";\n\ndhoro x = 15;\ndhoro y = 30;\n\njodi (x > 10 ar y > 20) {\n  dekha "Both TRUE (ar)!";\n}\n\njodi (x == 100 ernay y == 30) {\n  dekha "At least one TRUE (ernay)!";\n}`
    };

    function loadPreset() {
      const selected = document.getElementById("presetSelect").value;
      document.getElementById("codeEditor").value = presets[selected] || "";
    }

    function insertKeyword(kw) {
      const editor = document.getElementById("codeEditor");
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const text = editor.value;
      editor.value = text.substring(0, start) + kw + text.substring(end);
      editor.focus();
      editor.selectionStart = editor.selectionEnd = start + kw.length;
    }

    function clearConsole() {
      document.getElementById("consoleOutput").textContent = "";
    }

    function printConsole(text) {
      const consoleEl = document.getElementById("consoleOutput");
      consoleEl.textContent += text + "\n";
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    let inputResolver = null;

    function promptInput(varName) {
      return new Promise((resolve) => {
        const inputRow = document.getElementById("inputRow");
        const inputField = document.getElementById("userInput");
        inputRow.classList.add("active");
        inputField.value = "";
        inputField.focus();
        inputResolver = resolve;
      });
    }

    function handleInputSubmit(e) {
      if (e.key === "Enter") {
        const val = parseInt(document.getElementById("userInput").value) || 0;
        document.getElementById("inputRow").classList.remove("active");
        printConsole(`> ${val}`);
        if (inputResolver) {
          const res = inputResolver;
          inputResolver = null;
          res(val);
        }
      }
    }

    // Sylheti AST Interpreter Engine
    async function runSylhetiCode() {
      clearConsole();
      document.getElementById("statusBadge").textContent = "Running...";
      document.getElementById("statusBadge").style.color = "#f59e0b";

      const code = document.getElementById("codeEditor").value;
      const symbols = {};

      try {
        const lines = code.split('\n');
        for (let i = 0; i < lines.length; i++) {
          let line = lines[i].trim();
          if (!line || line.startsWith('//')) continue;

          if (line.startsWith('dekha ')) {
            let exprStr = line.substring(6).replace(/;$/, '').trim();
            if (exprStr.startsWith('"') && exprStr.endsWith('"')) {
              printConsole(exprStr.slice(1, -1));
            } else {
              let val = evaluate(exprStr, symbols);
              printConsole(val);
            }
          } else if (line.startsWith('dhoro ')) {
            let decl = line.substring(6).replace(/;$/, '').trim();
            if (decl.includes('=')) {
              let [name, expr] = decl.split('=').map(s => s.trim());
              symbols[name] = evaluate(expr, symbols);
            } else {
              symbols[decl] = 0;
            }
          } else if (line.startsWith('ne ')) {
            let varName = line.substring(3).replace(/;$/, '').trim();
            let val = await promptInput(varName);
            symbols[varName] = val;
          } else if (line.includes('=')) {
            let [name, expr] = line.replace(/;$/, '').split('=').map(s => s.trim());
            if (symbols.hasOwnProperty(name)) {
              symbols[name] = evaluate(expr, symbols);
            }
          }
        }
        document.getElementById("statusBadge").textContent = "Exit 0";
        document.getElementById("statusBadge").style.color = "#10b981";
      } catch (err) {
        printConsole("Runtime Error: " + err.message);
        document.getElementById("statusBadge").textContent = "Error";
        document.getElementById("statusBadge").style.color = "#ef4444";
      }
    }

    function evaluate(expr, symbols) {
      expr = expr.replace(/\bhasa\b/g, '1').replace(/\bmisa\b/g, '0');
      while (expr.includes('^')) {
        let parts = expr.split('^');
        let right = evaluate(parts.pop(), symbols);
        let left = evaluate(parts.join('^'), symbols);
        return Math.pow(left, right);
      }

      Object.keys(symbols).forEach(key => {
        const regex = new RegExp(`\\b${key}\\b`, 'g');
        expr = expr.replace(regex, symbols[key]);
      });

      expr = expr.replace(/\bar\b/g, '&&').replace(/\bernay\b/g, '||').replace(/\bnabe\b/g, '!');
      try {
        return Function(`"use strict"; return (${expr})`)();
      } catch (e) {
        return 0;
      }
    }

    // Initialize with simple preset
    loadPreset();
  </script>
</body>
</html>
